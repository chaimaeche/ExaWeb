<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>ExaWeb - Examen en cours</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/js/all.min.js"></script>
  <style>
    /* =========================================
       STYLE: BLACK, YELLOW & GRID (LIGHT)
       ========================================= */
    body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background-color: #fafafa;
        background-image: 
            linear-gradient(to right, rgba(17, 17, 17, 0.05) 1px, transparent 1px),
            linear-gradient(to bottom, rgba(17, 17, 17, 0.05) 1px, transparent 1px);
        background-size: 40px 40px;
        color: #111111;
        margin: 0;
        padding: 0;
        min-height: 100vh;
        overflow-x: hidden;
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    body::before, body::after {
        content: '';
        position: fixed;
        width: 600px;
        height: 600px;
        border-radius: 50%;
        z-index: -1;
        filter: blur(120px);
        opacity: 0.4;
        animation: orbMove 15s infinite alternate ease-in-out;
    }

    body::before {
        background: #ffcc00;
        top: -150px;
        left: -150px;
    }

    body::after {
        background: #ff0055;
        bottom: -150px;
        right: -100px;
        animation-delay: -7s;
        animation-duration: 20s;
    }

    @keyframes orbMove {
        0% { transform: translate(0, 0) scale(1); }
        50% { transform: translate(150px, 100px) scale(1.2); }
        100% { transform: translate(-50px, 150px) scale(0.9); }
    }

    /* الكارطة الرئيسية */
    .glass-card {
        background: rgba(255, 255, 255, 0.9);
        backdrop-filter: blur(10px);
        border: 2px solid #111111;
        border-radius: 24px;
        padding: 40px;
        box-shadow: 10px 10px 0px #111111;
        width: 100%;
        max-width: 48rem;
        transition: transform 0.3s ease;
        position: relative;
        z-index: 10;
        margin: 40px 0;
    }

    .cyber-title {
        font-size: 2.2em;
        margin-bottom: 20px;
        color: #111111;
        text-transform: uppercase;
        letter-spacing: 1px;
        text-align: center;
        font-weight: 900;
    }

    /* بوطونة Suivant و Retour */
    .cyber-btn {
        background: #111111;
        color: #ffcc00;
        border: 2px solid #111111;
        font-weight: 800;
        font-size: 1.1em;
        padding: 12px 30px;
        border-radius: 12px;
        cursor: pointer;
        transition: all 0.3s ease;
        text-transform: uppercase;
        letter-spacing: 1px;
        box-shadow: 4px 4px 0px #ffcc00;
    }

    .cyber-btn:hover {
        background: #ffcc00;
        color: #111111;
        box-shadow: 6px 6px 0px #111111;
        transform: translate(-2px, -2px);
    }

    /* ستايل ديال الاختيارات (QCM Choices) */
    .cyber-choice {
        background: #f8fafc;
        border: 2px solid #cbd5e1;
        color: #111111;
        transition: all 0.3s ease;
    }
    
    .cyber-choice:hover {
        background: #ffffff;
        border-color: #111111;
        box-shadow: 4px 4px 0px #ffcc00;
        transform: translateX(5px);
    }

    /* ملي الطالب كيكليكي على شي اختيار (Checked state in JS) */
    .cyber-choice input[type="radio"]:checked + span {
        color: #ff0055;
        font-weight: 900;
    }

    /* ستايل العداد Timer */
    .cyber-timer {
        color: #ff0055;
        background: #ffe4e6;
        padding: 10px 20px;
        border-radius: 50px;
        border: 2px solid #ff0055;
        letter-spacing: 2px;
        font-weight: 900;
        box-shadow: 4px 4px 0px #ff0055;
    }

    /* لون الراديو بوطون (الدائرة ديال الاختيار) */
    input[type="radio"] {
        accent-color: #ff0055;
        transform: scale(1.3);
        cursor: pointer;
    }
  </style>
</head>
<body class="px-4">
  <div class="w-full flex justify-center">
    <div class="glass-card">
      
      <h1 id="exam-title" class="cyber-title"><i class="fas fa-spinner fa-spin mr-2"></i> Chargement...</h1>
      
      <div id="quiz-container" class="hidden">
        <div id="question-container" class="mb-6">
          <div id="question-text" class="text-xl font-bold text-gray-800 mb-6 pb-4 border-b-2 border-gray-200">Chargement...</div>
          <div id="choices-container" class="space-y-4"></div>
        </div>
        
        <div class="flex justify-between items-center mt-8 pt-4 border-t-2 border-gray-200">
          <div id="timer" class="cyber-timer text-2xl flex items-center">
            <i class="fas fa-clock mr-2"></i> <span id="time">00:30</span>
          </div>
          <button id="next-btn" class="cyber-btn">Suivant <i class="fas fa-arrow-right ml-2"></i></button>
        </div>
      </div>

      <div id="result-container" class="hidden text-center py-8">
        <i class="fas fa-trophy text-6xl text-yellow-500 mb-4 drop-shadow-[0_4px_4px_rgba(0,0,0,0.3)]"></i>
        <h2 class="text-4xl font-black text-gray-900 mb-6 uppercase tracking-wider">Examen Terminé !</h2>
        
        <div class="bg-gray-100 border-2 border-gray-300 rounded-2xl p-6 mb-8 inline-block shadow-inner">
            <p class="text-2xl text-gray-700 font-bold uppercase tracking-wide">Votre Score :</p>
            <p class="mt-2"><span id="score" class="font-black text-green-600 text-6xl mx-2">0</span> <span class="text-3xl text-gray-500">/</span> <span id="total" class="text-4xl font-bold text-gray-800 mx-2">0</span></p>
        </div>
        <br>
        <button onclick="location.href='index.html'" class="cyber-btn mt-4"><i class="fas fa-home mr-2"></i> Retour à l'accueil</button>
      </div>
      
    </div>
  </div>

  <script>
    const examCode = new URLSearchParams(window.location.search).get("examId");
    
    let questions = [];
    let currentQuestion = 0;
    let score = 0;
    let timer;
    let timeLeft = 30;

    const questionText = document.getElementById("question-text");
    const choicesContainer = document.getElementById("choices-container");
    const nextBtn = document.getElementById("next-btn");
    const timerDisplay = document.getElementById("time");
    const quizContainer = document.getElementById("quiz-container");
    const examTitle = document.getElementById("exam-title");

    if (!examCode) {
      alert("Aucun code d'examen fourni !");
      window.location.href = "index.html";
    } else {
      fetch('http://localhost:8000/api/exams/' + examCode)
      .then(res => {
        if (!res.ok) throw new Error("Examen introuvable");
        return res.json();
      })
      .then(data => {
        if (data.questions && data.questions.length > 0) {
          // حيدت ديك ايقونة التحميل وحطيت العنوان
          examTitle.innerHTML = `<i class="fas fa-file-signature text-yellow-500 mr-2"></i> ` + data.exam.titre;
          
          questions = data.questions.map(q => {
            return {
              question: q.texte_question,
              choices: [q.choix1, q.choix2, q.choix3, q.choix4],
              correct: parseInt(q.reponse_correcte) - 1 
            };
          });

          quizContainer.classList.remove("hidden");
          showQuestion();
        } else {
          alert("Cet examen n'a pas encore de questions !");
          window.location.href = "index.html";
        }
      })
      .catch(err => {
        alert("Code invalide ou examen introuvable !");
        window.location.href = "index.html";
      });
    }

    function showQuestion() {
      clearInterval(timer);
      timeLeft = 30;
      startTimer();
      
      const q = questions[currentQuestion];
      questionText.innerHTML = `<span class="text-yellow-600 mr-2">Q${currentQuestion + 1}.</span> ${q.question}`;
      choicesContainer.innerHTML = "";
      
      q.choices.forEach((choice, index) => {
        const label = document.createElement("label");
        // الستيل الجديد ديال الاختيارات
        label.className = "cyber-choice flex items-center space-x-4 p-4 rounded-xl cursor-pointer";
        label.innerHTML = `
          <input type="radio" name="answer" value="${index}" class="form-radio h-5 w-5">
          <span class="font-bold text-lg">${choice}</span>
        `;
        
        // لعيبة باش ملي يكليكي يبدل اللون ديال البوردر
        label.addEventListener('click', function() {
            document.querySelectorAll('.cyber-choice').forEach(el => {
                el.style.borderColor = '#cbd5e1';
                el.style.boxShadow = 'none';
            });
            this.style.borderColor = '#111111';
            this.style.boxShadow = '4px 4px 0px #ffcc00';
        });

        choicesContainer.appendChild(label);
      });
    }

    function startTimer() {
      timerDisplay.textContent = "00:30";
      timerDisplay.parentElement.style.color = '#ff0055';
      timerDisplay.parentElement.style.borderColor = '#ff0055';
      timerDisplay.parentElement.style.boxShadow = '4px 4px 0px #ff0055';

      timer = setInterval(() => {
        timeLeft--;
        const seconds = String(timeLeft % 60).padStart(2, '0');
        timerDisplay.textContent = `00:${seconds}`;
        
        // ملي كيبقاو 10 ثواني، كيرجع التايمر كيخوف
        if(timeLeft <= 10) {
            timerDisplay.parentElement.style.backgroundColor = '#ff0055';
            timerDisplay.parentElement.style.color = '#ffffff';
        }

        if (timeLeft <= 0) {
          clearInterval(timer);
          nextBtn.click(); 
        }
      }, 1000);
    }

    nextBtn.addEventListener("click", () => {
      const selected = document.querySelector('input[name="answer"]:checked');
      
      if (selected) {
        if (parseInt(selected.value) === questions[currentQuestion].correct) {
          score++;
        }
      }

      currentQuestion++;
      
      if (currentQuestion < questions.length) {
        showQuestion();
      } else {
        clearInterval(timer);
        quizContainer.classList.add("hidden");
        document.getElementById("result-container").classList.remove("hidden");
        document.getElementById("score").textContent = score;
        document.getElementById("total").textContent = questions.length;
        examTitle.innerHTML = `<i class="fas fa-clipboard-check text-green-500 mr-2"></i> Rapport Final`;
      }
    });
  </script>
</body>
</html>
