<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>ExaWeb - Examen en cours</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/js/all.min.js"></script>
  <style>
    body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background: #05050a;
        background-image: radial-gradient(circle at 15% 50%, rgba(188, 19, 254, 0.15), transparent 50%),
                          radial-gradient(circle at 85% 30%, rgba(0, 255, 255, 0.15), transparent 50%);
        color: #fff;
        margin: 0;
        padding: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    @keyframes antigravity {
        0% { transform: translateY(0px); }
        50% { transform: translateY(-10px); }
        100% { transform: translateY(0px); }
    }

    @keyframes textTrain {
        0% { background-position: 0% center; }
        100% { background-position: 200% center; }
    }

    @keyframes neonPulse {
        0% { box-shadow: 0 0 5px rgba(0, 255, 255, 0.2), inset 0 0 5px rgba(0, 255, 255, 0.1); }
        50% { box-shadow: 0 0 15px rgba(0, 255, 255, 0.5), inset 0 0 10px rgba(0, 255, 255, 0.2); }
        100% { box-shadow: 0 0 5px rgba(0, 255, 255, 0.2), inset 0 0 5px rgba(0, 255, 255, 0.1); }
    }

    .glass-card {
        background: rgba(20, 20, 25, 0.6);
        backdrop-filter: blur(25px);
        -webkit-backdrop-filter: blur(25px);
        border: 1px solid rgba(255, 255, 255, 0.05);
        border-radius: 24px;
        padding: 40px;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), inset 0 0 0 1px rgba(0, 255, 255, 0.1);
        animation: antigravity 6s infinite ease-in-out;
        transition: all 0.4s ease;
        width: 100%;
        max-width: 42rem; /* كبرناها شوية باش تهز الأسئلة على خاطرها */
    }

    .glass-card:hover {
        animation-play-state: paused;
        transform: translateY(-5px);
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.9), inset 0 0 0 1px rgba(188, 19, 254, 0.3);
    }

    .cyber-title {
        font-size: 2.2em;
        margin-bottom: 20px;
        background: linear-gradient(90deg, #00ffff, #bc13fe, #ffffff, #bc13fe, #00ffff);
        background-size: 200% auto;
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        animation: textTrain 3s linear infinite;
        letter-spacing: 2px;
        text-align: center;
        font-weight: bold;
    }

    .cyber-btn {
        background: transparent;
        color: #00ffff;
        border: 1px solid #00ffff;
        font-weight: 600;
        font-size: 1.1em;
        padding: 12px 30px;
        border-radius: 50px;
        cursor: pointer;
        transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1);
        text-transform: uppercase;
        letter-spacing: 2px;
        animation: neonPulse 2s infinite;
    }

    .cyber-btn:hover {
        background: #00ffff;
        color: #000;
        box-shadow: 0 0 20px rgba(0, 255, 255, 0.6), 0 0 40px rgba(0, 255, 255, 0.3);
        transform: translateY(-3px) scale(1.05);
    }

    /* ستايل ديال الاختيارات (QCM Choices) */
    .cyber-choice {
        background: rgba(0, 0, 0, 0.4);
        border: 1px solid rgba(255, 255, 255, 0.05);
        color: #aeb8da;
    }
    
    .cyber-choice:hover {
        background: rgba(0, 255, 255, 0.1);
        border-color: #00ffff;
        box-shadow: 0 0 15px rgba(0, 255, 255, 0.2);
        color: #fff;
    }

    /* ستايل العداد Timer */
    .cyber-timer {
        color: #bc13fe;
        text-shadow: 0 0 10px rgba(188, 19, 254, 0.6);
        letter-spacing: 2px;
    }

    /* لون الراديو بوطون (الدائرة ديال الاختيار) */
    input[type="radio"] {
        accent-color: #00ffff;
        transform: scale(1.2);
    }
  </style>
</head>
<body>
  <div class="w-full px-4 flex justify-center">
    <div class="glass-card">
      
      <h1 id="exam-title" class="cyber-title">Chargement de l'examen...</h1>
      
      <div id="quiz-container" class="hidden">
        <div id="question-container" class="mb-6">
          <div id="question-text" class="text-xl font-bold text-white mb-6 pb-4 border-b border-gray-700">Chargement...</div>
          <div id="choices-container" class="space-y-4"></div>
        </div>
        
        <div class="flex justify-between items-center mt-8">
          <div id="timer" class="cyber-timer font-bold text-2xl">
            <i class="fas fa-clock mr-2"></i> <span id="time">00:30</span>
          </div>
          <button id="next-btn" class="cyber-btn">Suivant <i class="fas fa-arrow-right ml-2"></i></button>
        </div>
      </div>

      <div id="result-container" class="hidden text-center">
        <h2 class="text-4xl font-bold text-green-400 mb-6 drop-shadow-[0_0_15px_rgba(74,222,128,0.5)]">Examen Terminé !</h2>
        <p class="mb-8 text-2xl text-gray-300">Votre Score : <span id="score" class="font-bold text-cyan-400 text-4xl mx-2">0</span> / <span id="total" class="text-3xl mx-2">0</span></p>
        <button onclick="location.href='index.html'" class="cyber-btn mt-4">Retour à l'accueil</button>
      </div>
      
    </div>
  </div>

  <script>
    const examCode = new URLSearchParams(window.location.search).get("examId");
    
    let questions = [];
    let currentQuestion = 0;
    let score = 0;
    let timer;
    let timeLeft = 30;

    const questionText = document.getElementById("question-text");
    const choicesContainer = document.getElementById("choices-container");
    const nextBtn = document.getElementById("next-btn");
    const timerDisplay = document.getElementById("time");
    const quizContainer = document.getElementById("quiz-container");
    const examTitle = document.getElementById("exam-title");

    if (!examCode) {
      alert("Aucun code d'examen fourni !");
      window.location.href = "index.html";
    } else {
      fetch('http://localhost:8000/api/exams/' + examCode)
      .then(res => {
        if (!res.ok) throw new Error("Examen introuvable");
        return res.json();
      })
      .then(data => {
        if (data.questions && data.questions.length > 0) {
          examTitle.textContent = data.exam.titre;
          
          questions = data.questions.map(q => {
            return {
              question: q.texte_question,
              choices: [q.choix1, q.choix2, q.choix3, q.choix4],
              correct: parseInt(q.reponse_correcte) - 1 
            };
          });

          quizContainer.classList.remove("hidden");
          showQuestion();
        } else {
          alert("Cet examen n'a pas encore de questions !");
          window.location.href = "index.html";
        }
      })
      .catch(err => {
        alert("Code invalide ou examen introuvable !");
        window.location.href = "index.html";
      });
    }

    function showQuestion() {
      clearInterval(timer);
      timeLeft = 30;
      startTimer();
      
      const q = questions[currentQuestion];
      questionText.textContent = `Question ${currentQuestion + 1} : ${q.question}`;
      choicesContainer.innerHTML = "";
      
      q.choices.forEach((choice, index) => {
        const label = document.createElement("label");
        // هنا بدلت الكلاسات باش يتماشاو مع التيمة الجديدة
        label.className = "cyber-choice flex items-center space-x-4 p-4 rounded-xl cursor-pointer transition";
        label.innerHTML = `
          <input type="radio" name="answer" value="${index}" class="form-radio h-5 w-5 cursor-pointer">
          <span class="font-medium text-lg">${choice}</span>
        `;
        choicesContainer.appendChild(label);
      });
    }

    function startTimer() {
      timerDisplay.textContent = "00:30";
      timer = setInterval(() => {
        timeLeft--;
        const seconds = String(timeLeft % 60).padStart(2, '0');
        timerDisplay.textContent = `00:${seconds}`;
        
        if (timeLeft <= 0) {
          clearInterval(timer);
          nextBtn.click(); 
        }
      }, 1000);
    }

    nextBtn.addEventListener("click", () => {
      const selected = document.querySelector('input[name="answer"]:checked');
      
      if (selected) {
        if (parseInt(selected.value) === questions[currentQuestion].correct) {
          score++;
        }
      }

      currentQuestion++;
      
      if (currentQuestion < questions.length) {
        showQuestion();
      } else {
        clearInterval(timer);
        quizContainer.classList.add("hidden");
        document.getElementById("result-container").classList.remove("hidden");
        document.getElementById("score").textContent = score;
        document.getElementById("total").textContent = questions.length;
        examTitle.textContent = "Rapport Final";
      }
    });
  </script>
</body>
</html>
