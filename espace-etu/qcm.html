<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>ExaWeb - Examen en cours</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/js/all.min.js"></script>
  <style>
    body {
      background-image: url('../frontend/img.jpeg') !important;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
    }

    .bg-overlay {
      background-color: rgba(255, 255, 255, 0.95);
      border-radius: 1rem;
      padding: 2rem;
    }
  </style>
</head>
<body>
  <div class="min-h-screen flex items-center justify-center py-10">
    <div class="w-full max-w-xl bg-overlay shadow-lg">
      
      <h1 id="exam-title" class="text-2xl font-bold text-center text-blue-700 mb-6">Chargement de l'examen...</h1>
      
      <div id="quiz-container" class="hidden">
        <div id="question-container" class="mb-4">
          <div id="question-text" class="text-lg font-bold text-gray-800 mb-4 pb-2 border-b">Chargement...</div>
          <div id="choices-container" class="space-y-3"></div>
        </div>
        
        <div class="flex justify-between items-center mt-6">
          <div id="timer" class="text-blue-700 font-bold text-xl">
            <i class="fas fa-clock"></i> <span id="time">00:30</span>
          </div>
          <button id="next-btn" class="bg-blue-600 text-white px-6 py-2 rounded font-bold hover:bg-blue-800 transition">Suivant</button>
        </div>
      </div>

      <div id="result-container" class="hidden text-center">
        <h2 class="text-3xl font-bold text-green-600 mb-4">Examen Terminé !</h2>
        <p class="mb-6 text-xl">Votre Score : <span id="score" class="font-bold text-blue-600">0</span> / <span id="total">0</span></p>
        <button onclick="location.href='index.html'" class="bg-blue-600 text-white px-6 py-2 rounded font-bold hover:bg-blue-800">Retour à l'accueil</button>
      </div>
      
    </div>
  </div>

  <script>
    // 1. كنجبدو الكود ديال الامتحان من الرابط
    const examCode = new URLSearchParams(window.location.search).get("examId");
    
    let questions = [];
    let currentQuestion = 0;
    let score = 0;
    let timer;
    let timeLeft = 30;

    const questionText = document.getElementById("question-text");
    const choicesContainer = document.getElementById("choices-container");
    const nextBtn = document.getElementById("next-btn");
    const timerDisplay = document.getElementById("time");
    const quizContainer = document.getElementById("quiz-container");
    const examTitle = document.getElementById("exam-title");

    // 2. إيلا ماكاينش الكود، كنرجعوه للصفحة الأولى
    if (!examCode) {
      alert("Aucun code d'examen fourni !");
      window.location.href = "index.html";
    } else {
      // 3. كنجيبو الامتحان والأسئلة من الباك-اند
      fetch('http://localhost:8000/api/exams/' + examCode)
      .then(res => {
        if (!res.ok) throw new Error("Examen introuvable");
        return res.json();
      })
      .then(data => {
        if (data.questions && data.questions.length > 0) {
          // كنبدلو عنوان الصفحة بعنوان الامتحان الحقيقي
          examTitle.textContent = data.exam.titre;
          
          // كنقادو الأسئلة باش يفهمهم الكود ديالك
          questions = data.questions.map(q => {
            return {
              question: q.texte_question,
              choices: [q.choix1, q.choix2, q.choix3, q.choix4],
              correct: parseInt(q.reponse_correcte) - 1 // نقصنا 1 حيت الجافاسكريبت كيبدا من 0
            };
          });

          quizContainer.classList.remove("hidden");
          showQuestion();
        } else {
          alert("Cet examen n'a pas encore de questions !");
          window.location.href = "index.html";
        }
      })
      .catch(err => {
        alert("Code invalide ou examen introuvable !");
        window.location.href = "index.html";
      });
    }

    // 4. وظيفة عرض السؤال
    function showQuestion() {
      clearInterval(timer);
      timeLeft = 30;
      startTimer();
      
      const q = questions[currentQuestion];
      questionText.textContent = `Question ${currentQuestion + 1} : ${q.question}`;
      choicesContainer.innerHTML = "";
      
      q.choices.forEach((choice, index) => {
        const label = document.createElement("label");
        label.className = "flex items-center space-x-3 p-3 border rounded cursor-pointer hover:bg-blue-50 transition";
        label.innerHTML = `
          <input type="radio" name="answer" value="${index}" class="form-radio h-5 w-5 text-blue-600 cursor-pointer">
          <span class="text-gray-700 font-medium">${choice}</span>
        `;
        choicesContainer.appendChild(label);
      });
    }

    // 5. وظيفة العداد
    function startTimer() {
      timerDisplay.textContent = "00:30";
      timer = setInterval(() => {
        timeLeft--;
        const seconds = String(timeLeft % 60).padStart(2, '0');
        timerDisplay.textContent = `00:${seconds}`;
        
        if (timeLeft <= 0) {
          clearInterval(timer);
          nextBtn.click(); // كيدوز للسؤال الجاي أوتوماتيكيا إيلا سالا الوقت
        }
      }, 1000);
    }

    // 6. زر "التالي" والتحقق من الجواب
    nextBtn.addEventListener("click", () => {
      const selected = document.querySelector('input[name="answer"]:checked');
      
      // إيلا عزل الطالب شي جواب، كنتأكدو واش صحيح
      if (selected) {
        if (parseInt(selected.value) === questions[currentQuestion].correct) {
          score++;
        }
      }

      currentQuestion++;
      
      // واش باقين الأسئلة ولا سالينا؟
      if (currentQuestion < questions.length) {
        showQuestion();
      } else {
        clearInterval(timer);
        quizContainer.classList.add("hidden");
        document.getElementById("result-container").classList.remove("hidden");
        document.getElementById("score").textContent = score;
        document.getElementById("total").textContent = questions.length;
        examTitle.textContent = "Résultat Final";
      }
    });
  </script>
</body>
</html>
