<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>ExaWeb - Espace Étudiant</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <style>
    body {
      background-image: url('https://www.dropbox.com/scl/fi/lki8ya9jqvcy4lg803lky/lecture-hall-1.jpeg?raw=1');
      background-size: cover;
      background-position: center;
    }
    .bg-overlay {
      background-color: rgba(255, 255, 255, 0.95);
      border-radius: 1rem;
      padding: 2rem;
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center">
  <div class="w-full max-w-md bg-overlay shadow-lg text-center">
    <h1 class="text-2xl font-bold text-blue-700 mb-4">Espace Étudiant</h1>
    <p class="mb-6 text-gray-700">Entrez le code d'examen fourni par votre professeur :</p>
    
    <input type="text" id="exam-code" placeholder="ex: XV5BWW" class="w-full p-3 mb-4 border rounded text-center font-bold tracking-widest uppercase text-xl">
    
    <button onclick="startExam()" class="bg-blue-600 text-white px-4 py-3 rounded hover:bg-blue-800 w-full font-bold text-lg transition">
      Accéder à l'examen
    </button>
  </div>

  <script>
    function startExam() {
      // كنهزو الكود من الخانة وكنردوه حروف كبار
      const code = document.getElementById("exam-code").value.trim().toUpperCase();
      
      if (code) {
        // هاد السطر هو اللي كيدينا للصفحة ديال qcm وكيلصق الكود فالرابط
        window.location.href = "qcm.html?examId=" + encodeURIComponent(code);
      } else {
        alert("Veuillez entrer un code d'examen valide.");
      }
    }
  </script>
</body>
</html>
