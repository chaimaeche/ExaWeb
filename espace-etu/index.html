<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>ExaWeb - Espace Étudiant</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <style>
    body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background: #05050a;
        background-image: radial-gradient(circle at 15% 50%, rgba(188, 19, 254, 0.15), transparent 50%),
                          radial-gradient(circle at 85% 30%, rgba(0, 255, 255, 0.15), transparent 50%);
        color: #fff;
        margin: 0;
        padding: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    @keyframes antigravity {
        0% { transform: translateY(0px); }
        50% { transform: translateY(-10px); }
        100% { transform: translateY(0px); }
    }

    @keyframes textTrain {
        0% { background-position: 0% center; }
        100% { background-position: 200% center; }
    }

    @keyframes neonPulse {
        0% { box-shadow: 0 0 5px rgba(0, 255, 255, 0.2), inset 0 0 5px rgba(0, 255, 255, 0.1); }
        50% { box-shadow: 0 0 15px rgba(0, 255, 255, 0.5), inset 0 0 10px rgba(0, 255, 255, 0.2); }
        100% { box-shadow: 0 0 5px rgba(0, 255, 255, 0.2), inset 0 0 5px rgba(0, 255, 255, 0.1); }
    }

    .glass-card {
        background: rgba(20, 20, 25, 0.6);
        backdrop-filter: blur(25px);
        -webkit-backdrop-filter: blur(25px);
        border: 1px solid rgba(255, 255, 255, 0.05);
        border-radius: 24px;
        padding: 40px;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), inset 0 0 0 1px rgba(0, 255, 255, 0.1);
        animation: antigravity 6s infinite ease-in-out;
        transition: all 0.4s ease;
        width: 100%;
        max-width: 28rem;
    }

    .glass-card:hover {
        animation-play-state: paused;
        transform: translateY(-5px);
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.9), inset 0 0 0 1px rgba(188, 19, 254, 0.3);
    }

    .cyber-title {
        font-size: 2.2em;
        margin-bottom: 10px;
        background: linear-gradient(90deg, #00ffff, #bc13fe, #ffffff, #bc13fe, #00ffff);
        background-size: 200% auto;
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        animation: textTrain 3s linear infinite;
        letter-spacing: 2px;
        text-align: center;
        font-weight: bold;
    }

    .cyber-input {
        width: 100%;
        padding: 15px;
        margin-bottom: 25px;
        border-radius: 12px;
        background: rgba(0, 0, 0, 0.4);
        border: 1px solid rgba(255, 255, 255, 0.1);
        color: #00ffff;
        font-size: 1.5em;
        text-align: center;
        letter-spacing: 4px;
        font-family: 'Courier New', Courier, monospace;
        font-weight: bold;
        text-transform: uppercase;
        transition: all 0.3s ease;
    }

    .cyber-input::placeholder {
        color: rgba(255, 255, 255, 0.2);
        font-size: 0.8em;
        letter-spacing: 2px;
    }

    .cyber-input:focus {
        outline: none;
        border-color: transparent;
        background: rgba(0, 0, 0, 0.6);
        box-shadow: 0 0 0 1px rgba(0, 255, 255, 0.5), 0 0 20px rgba(0, 255, 255, 0.3);
    }

    .cyber-btn {
        background: transparent;
        color: #00ffff;
        border: 1px solid #00ffff;
        font-weight: 600;
        font-size: 1.1em;
        padding: 15px;
        border-radius: 50px;
        cursor: pointer;
        transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1);
        text-transform: uppercase;
        letter-spacing: 2px;
        width: 100%;
        animation: neonPulse 2s infinite;
    }

    .cyber-btn:hover {
        background: #00ffff;
        color: #000;
        box-shadow: 0 0 20px rgba(0, 255, 255, 0.6), 0 0 40px rgba(0, 255, 255, 0.3);
        transform: translateY(-3px) scale(1.02);
    }
  </style>
</head>
<body>

  <div class="glass-card">
    <h1 class="cyber-title">ESPACE ÉTUDIANT</h1>
    <p class="text-center text-gray-400 mb-8 text-sm uppercase tracking-wider">Portail d'accès aux examens</p>
    
    <input type="text" id="exam-code" placeholder="EX: XV5BWW" class="cyber-input">
    
    <button onclick="startExam()" class="cyber-btn">
      Accéder à l'examen
    </button>
  </div>

  <script>
    function startExam() {
      const code = document.getElementById("exam-code").value.trim().toUpperCase();
      
      if (code) {
        window.location.href = "qcm.html?examId=" + encodeURIComponent(code);
      } else {
        alert("Veuillez entrer un code d'examen valide.");
      }
    }
  </script>

</body>
</html>
