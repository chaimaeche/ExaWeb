<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>ExaWeb - Espace Étudiant</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <style>
    /* =========================================
       STYLE: BLACK, YELLOW & GRID (LIGHT)
       ========================================= */
    body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background-color: #fafafa;
        background-image: 
            linear-gradient(to right, rgba(17, 17, 17, 0.05) 1px, transparent 1px),
            linear-gradient(to bottom, rgba(17, 17, 17, 0.05) 1px, transparent 1px);
        background-size: 40px 40px;
        color: #111111;
        margin: 0;
        padding: 0;
        min-height: 100vh;
        overflow-x: hidden;
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    body::before, body::after {
        content: '';
        position: fixed;
        width: 600px;
        height: 600px;
        border-radius: 50%;
        z-index: -1;
        filter: blur(120px);
        opacity: 0.4;
        animation: orbMove 15s infinite alternate ease-in-out;
    }

    body::before {
        background: #ffcc00;
        top: -150px;
        left: -150px;
    }

    body::after {
        background: #ff0055;
        bottom: -150px;
        right: -100px;
        animation-delay: -7s;
        animation-duration: 20s;
    }

    @keyframes orbMove {
        0% { transform: translate(0, 0) scale(1); }
        50% { transform: translate(150px, 100px) scale(1.2); }
        100% { transform: translate(-50px, 150px) scale(0.9); }
    }

    .glass-card {
        background: rgba(255, 255, 255, 0.9);
        backdrop-filter: blur(10px);
        border: 2px solid #111111;
        border-radius: 24px;
        padding: 40px;
        box-shadow: 10px 10px 0px #111111;
        width: 100%;
        max-width: 28rem;
        transition: transform 0.3s ease;
        position: relative;
        z-index: 10;
    }

    .glass-card:hover {
        transform: translateY(-5px);
        box-shadow: 12px 12px 0px #ffcc00;
    }

    .cyber-title {
        font-size: 2.2em;
        margin-bottom: 5px;
        color: #111111;
        text-transform: uppercase;
        letter-spacing: 1px;
        text-align: center;
        font-weight: 900;
    }

    .cyber-input {
        width: 100%;
        padding: 16px;
        margin-bottom: 25px;
        border-radius: 12px;
        background: #f8fafc;
        border: 2px solid #cbd5e1;
        color: #111111;
        font-size: 1.5em;
        text-align: center;
        letter-spacing: 4px;
        font-family: 'Courier New', Courier, monospace;
        font-weight: 900;
        text-transform: uppercase;
        transition: all 0.3s ease;
        box-sizing: border-box;
    }

    .cyber-input::placeholder {
        color: #94a3b8;
        font-size: 0.8em;
        letter-spacing: 2px;
    }

    .cyber-input:focus {
        outline: none;
        border-color: #111111;
        background: #ffffff;
        box-shadow: 4px 4px 0px #ffcc00;
    }

    .cyber-btn {
        background: #111111;
        color: #ffcc00;
        border: 2px solid #111111;
        font-weight: 800;
        font-size: 1.1em;
        padding: 16px 25px;
        border-radius: 12px;
        cursor: pointer;
        transition: all 0.3s ease;
        text-transform: uppercase;
        letter-spacing: 1px;
        width: 100%;
        box-shadow: 4px 4px 0px #ffcc00;
    }

    .cyber-btn:hover {
        background: #ffcc00;
        color: #111111;
        box-shadow: 6px 6px 0px #111111;
        transform: translate(-2px, -2px);
    }
  </style>
</head>
<body>

  <div class="glass-card">
    <h1 class="cyber-title"><i class="fa-solid fa-user-graduate"></i> ESPACE ÉTUDIANT</h1>
    <p class="text-center text-gray-500 font-bold mb-8 text-sm uppercase tracking-wider">Portail d'accès aux examens</p>
    
    <input type="text" id="exam-code" placeholder="EX: XV5BWW" class="cyber-input">
    
    <button onclick="startExam()" class="cyber-btn">
      Accéder à l'examen
    </button>
  </div>

  <script>
    function startExam() {
      const code = document.getElementById("exam-code").value.trim().toUpperCase();
      
      if (code) {
        window.location.href = "qcm.html?examId=" + encodeURIComponent(code);
      } else {
        alert("Veuillez entrer un code d'examen valide.");
      }
    }
  </script>

</body>
</html>
