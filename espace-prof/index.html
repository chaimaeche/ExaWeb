<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>ExaWeb - Espace Enseignant</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <style>
    /* =========================================
       STYLE: BLACK, YELLOW & GRID (LIGHT)
       ========================================= */
    body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background-color: #fafafa;
        background-image: 
            linear-gradient(to right, rgba(17, 17, 17, 0.05) 1px, transparent 1px),
            linear-gradient(to bottom, rgba(17, 17, 17, 0.05) 1px, transparent 1px);
        background-size: 40px 40px;
        color: #111111;
        margin: 0;
        padding: 0;
        min-height: 100vh;
        overflow-x: hidden;
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    body::before, body::after {
        content: '';
        position: fixed;
        width: 600px;
        height: 600px;
        border-radius: 50%;
        z-index: -1;
        filter: blur(120px);
        opacity: 0.4;
        animation: orbMove 15s infinite alternate ease-in-out;
    }

    body::before {
        background: #ffcc00;
        top: -150px;
        left: -150px;
    }

    body::after {
        background: #ff0055;
        bottom: -150px;
        right: -100px;
        animation-delay: -7s;
        animation-duration: 20s;
    }

    @keyframes orbMove {
        0% { transform: translate(0, 0) scale(1); }
        50% { transform: translate(150px, 100px) scale(1.2); }
        100% { transform: translate(-50px, 150px) scale(0.9); }
    }

    .glass-card {
        background: rgba(255, 255, 255, 0.9);
        backdrop-filter: blur(10px);
        border: 2px solid #111111;
        border-radius: 24px;
        padding: 40px;
        box-shadow: 10px 10px 0px #111111;
        width: 100%;
        max-width: 48rem;
        transition: transform 0.3s ease;
        position: relative;
        z-index: 10;
        margin: 40px 0;
    }

    .cyber-title {
        font-size: 2.2em;
        margin-bottom: 20px;
        color: #111111;
        text-transform: uppercase;
        letter-spacing: 1px;
        text-align: center;
        font-weight: 900;
    }

    .cyber-input, .cyber-select {
        width: 100%;
        padding: 16px;
        margin-bottom: 16px;
        border-radius: 12px;
        background: #f8fafc;
        border: 2px solid #cbd5e1;
        color: #111111;
        font-size: 1.05em;
        transition: all 0.3s ease;
        box-sizing: border-box;
        font-weight: 500;
    }

    .cyber-input::placeholder {
        color: #94a3b8;
    }

    .cyber-input:focus, .cyber-select:focus {
        outline: none;
        border-color: #111111;
        background: #ffffff;
        box-shadow: 4px 4px 0px #ffcc00;
    }

    .cyber-btn {
        background: #111111;
        color: #ffcc00;
        border: 2px solid #111111;
        font-weight: 800;
        font-size: 1.1em;
        padding: 16px 25px;
        border-radius: 12px;
        cursor: pointer;
        transition: all 0.3s ease;
        text-transform: uppercase;
        letter-spacing: 1px;
        width: 100%;
        box-shadow: 4px 4px 0px #ffcc00;
    }

    .cyber-btn:hover:not(:disabled) {
        background: #ffcc00;
        color: #111111;
        box-shadow: 6px 6px 0px #111111;
        transform: translate(-2px, -2px);
    }

    .cyber-btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
        box-shadow: none;
        transform: none;
        background: #e2e8f0;
        color: #94a3b8;
        border-color: #cbd5e1;
    }

    .cyber-btn-add {
        background: #ffcc00;
        color: #111111;
        box-shadow: 4px 4px 0px #111111;
    }

    .cyber-btn-add:hover:not(:disabled) {
        background: #111111;
        color: #ffcc00;
        box-shadow: 6px 6px 0px #ffcc00;
    }

    /* ستايل الكونتينر ديال الكود باش يبان مودرن */
    .code-container {
        display: inline-flex;
        align-items: center;
        background: #ffcc00;
        padding: 10px 15px 10px 30px;
        border-radius: 12px;
        border: 2px solid #111111;
        margin: 15px 0;
        box-shadow: 6px 6px 0px #111111;
        gap: 15px;
    }

    .code-display {
        font-size: 2em;
        font-family: 'Courier New', Courier, monospace;
        color: #111111;
        letter-spacing: 6px;
        font-weight: 900;
        margin: 0;
    }

    /* أيقونة النسخ (Copy Icon) */
    .copy-icon {
        background: #111111;
        color: #ffcc00;
        padding: 10px 12px;
        border-radius: 8px;
        cursor: pointer;
        transition: all 0.2s ease;
        font-size: 1.2em;
        border: 2px solid transparent;
    }

    .copy-icon:hover {
        background: #ffffff;
        color: #111111;
        border-color: #111111;
        transform: scale(1.05);
    }

    .neon-divider {
        height: 2px;
        background: #111111;
        margin: 40px 0;
        border: none;
        opacity: 0.1;
    }

    /* Tooltip للنسخ */
    #copy-tooltip {
        position: absolute;
        background: #111;
        color: #fff;
        padding: 5px 10px;
        border-radius: 5px;
        font-size: 0.8em;
        top: -30px;
        right: 0;
        opacity: 0;
        transition: opacity 0.3s;
        pointer-events: none;
    }
  </style>
</head>
<body class="py-10">

  <div class="w-full px-4 flex justify-center">
    <div class="glass-card">
      
      <div id="section-creation" class="text-center">
        <h1 class="cyber-title"><i class="fa-solid fa-gear"></i> GÉNÉRATEUR D'EXAMEN</h1>
        <input type="text" id="titre-examen" placeholder="Titre de l'examen (ex: Programmation S5)" class="cyber-input text-center text-lg">
        <button onclick="creerExamen()" class="cyber-btn mt-2">
          Générer le Code Sécurisé
        </button>

        <div id="resultat" class="mt-8 hidden">
          <p class="text-gray-600 font-bold uppercase tracking-widest text-sm">Clé d'accès générée :</p>
          
          <!-- الكونتينر اللي جمعت فيه الكود + الأيقونة ديال النسخ -->
          <div class="code-container relative">
            <h2 id="code-affiche" class="code-display uppercase"></h2>
            <i class="fa-regular fa-copy copy-icon" onclick="copierCode()" title="Copier le code"></i>
            <span id="copy-tooltip">Copié !</span>
          </div>

          <p class="text-sm text-gray-800 font-bold mb-2 tracking-wide block">Transmettez cette clé aux étudiants pour l'accès.</p>
        </div>
      </div>

      <hr class="neon-divider">

      <div id="section-questions" class="hidden">
        <h2 class="cyber-title" style="font-size: 1.5em;"><i class="fa-solid fa-database"></i> Base de Données des Questions</h2>
        
        <input type="text" id="texte-question" placeholder="Saisir la question ici..." class="cyber-input font-semibold text-lg">
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-2">
          <input type="text" id="choix1" placeholder="Option A" class="cyber-input mb-0">
          <input type="text" id="choix2" placeholder="Option B" class="cyber-input mb-0">
          <input type="text" id="choix3" placeholder="Option C" class="cyber-input mb-0">
          <input type="text" id="choix4" placeholder="Option D" class="cyber-input mb-0">
        </div>

        <div class="flex flex-col md:flex-row items-center justify-between gap-4 mt-6 mb-6 p-4 rounded-xl" style="background: #f8fafc; border: 2px dashed #111111;">
          <label class="font-bold text-gray-800 tracking-wide">Définir la réponse correcte :</label>
          <select id="reponse-correcte" class="cyber-select w-full md:w-1/2 mb-0 border-2 border-black">
            <option value="1">Option A</option>
            <option value="2">Option B</option>
            <option value="3">Option C</option>
            <option value="4">Option D</option>
          </select>
        </div>

        <button onclick="ajouterQuestion()" class="cyber-btn cyber-btn-add">
          Insérer la question au système
        </button>

        <p id="msg-succes" class="text-green-600 font-bold mt-6 text-center tracking-wider hidden border-2 border-green-600 bg-green-100 p-2 rounded-lg">✓ Données enregistrées avec succès !</p>
      </div>

    </div>
  </div>

  <script>
    let currentExamId = null;

    function creerExamen() {
      const titre = document.getElementById("titre-examen").value;
      const profId = 1; 

      if (!titre) {
        alert("Veuillez entrer un titre.");
        return;
      }

      fetch('http://localhost:8000/api/exams', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
        body: JSON.stringify({ titre: titre, professeur_id: profId })
      })
      .then(res => res.json())
      .then(data => {
        if(data.exam) {
          document.getElementById("resultat").classList.remove("hidden");
          document.getElementById("code-affiche").innerText = data.exam.code_examen;
          document.getElementById("section-questions").classList.remove("hidden");
          
          currentExamId = data.exam.id;
          
          const btnGen = document.querySelector("button[onclick='creerExamen()']");
          btnGen.disabled = true;
          btnGen.classList.add("opacity-50");
        } else {
          alert("Erreur: " + data.message);
        }
      })
      .catch(err => console.error(err));
    }

    function ajouterQuestion() {
      if (!currentExamId) return;

      const questionData = {
        exam_id: currentExamId,
        texte_question: document.getElementById("texte-question").value,
        choix1: document.getElementById("choix1").value,
        choix2: document.getElementById("choix2").value,
        choix3: document.getElementById("choix3").value,
        choix4: document.getElementById("choix4").value,
        reponse_correcte: document.getElementById("reponse-correcte").value
      };

      if(!questionData.texte_question || !questionData.choix1 || !questionData.choix4) {
          alert("Veuillez remplir la question et tous les choix.");
          return;
      }

      fetch('http://localhost:8000/api/questions', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
        body: JSON.stringify(questionData)
      })
      .then(res => res.json())
      .then(data => {
        if(data.question) {
          const msg = document.getElementById("msg-succes");
          msg.classList.remove("hidden");
          
          document.getElementById("texte-question").value = "";
          document.getElementById("choix1").value = "";
          document.getElementById("choix2").value = "";
          document.getElementById("choix3").value = "";
          document.getElementById("choix4").value = "";
          document.getElementById("reponse-correcte").value = "1";

          setTimeout(() => { msg.classList.add("hidden"); }, 3000);
        } else {
          alert("Erreur lors de l'ajout de la question.");
        }
      })
      .catch(err => console.error(err));
    }

    // هادي الفونكسيون اللي زدت باش تكوبي الكود (Copy to clipboard)
    function copierCode() {
        const code = document.getElementById("code-affiche").innerText;
        navigator.clipboard.writeText(code).then(() => {
            const tooltip = document.getElementById("copy-tooltip");
            tooltip.style.opacity = "1";
            
            // كتغير الأيقونة لعلامة "صحيح" (Check) باش تبان باللي تڭوبات
            const icon = document.querySelector(".copy-icon");
            icon.classList.remove("fa-regular", "fa-copy");
            icon.classList.add("fa-solid", "fa-check");
            icon.style.color = "#4ade80"; // لون أخضر
            
            setTimeout(() => { 
                tooltip.style.opacity = "0"; 
                // كترجع الأيقونة لأصلها من بعد ثانيتين
                icon.classList.remove("fa-solid", "fa-check");
                icon.classList.add("fa-regular", "fa-copy");
                icon.style.color = "#ffcc00"; // كترجع للصفر
            }, 2000);
        });
    }
  </script>
</body>
</html>
