<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>ExaWeb - Espace Enseignant</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <style>
    body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background: #05050a;
        background-image: radial-gradient(circle at 15% 50%, rgba(188, 19, 254, 0.15), transparent 50%),
                          radial-gradient(circle at 85% 30%, rgba(0, 255, 255, 0.15), transparent 50%);
        color: #fff;
        margin: 0;
        padding: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    @keyframes antigravity {
        0% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
        100% { transform: translateY(0px); }
    }

    @keyframes textTrain {
        0% { background-position: 0% center; }
        100% { background-position: 200% center; }
    }

    @keyframes neonPulse {
        0% { box-shadow: 0 0 5px rgba(0, 255, 255, 0.2), inset 0 0 5px rgba(0, 255, 255, 0.1); }
        50% { box-shadow: 0 0 15px rgba(0, 255, 255, 0.4), inset 0 0 10px rgba(0, 255, 255, 0.2); }
        100% { box-shadow: 0 0 5px rgba(0, 255, 255, 0.2), inset 0 0 5px rgba(0, 255, 255, 0.1); }
    }

    .glass-card {
        background: rgba(20, 20, 25, 0.7);
        backdrop-filter: blur(25px);
        -webkit-backdrop-filter: blur(25px);
        border: 1px solid rgba(255, 255, 255, 0.05);
        border-radius: 24px;
        padding: 40px;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), inset 0 0 0 1px rgba(0, 255, 255, 0.1);
        animation: antigravity 7s infinite ease-in-out;
        transition: all 0.4s ease;
        width: 100%;
        max-width: 48rem;
    }

    .glass-card:hover {
        animation-play-state: paused;
        transform: translateY(-5px);
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.9), inset 0 0 0 1px rgba(188, 19, 254, 0.3);
    }

    .cyber-title {
        font-size: 2em;
        margin-bottom: 20px;
        background: linear-gradient(90deg, #00ffff, #bc13fe, #ffffff, #bc13fe, #00ffff);
        background-size: 200% auto;
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        animation: textTrain 3s linear infinite;
        letter-spacing: 1px;
        text-align: center;
        font-weight: bold;
    }

    .cyber-input, .cyber-select {
        width: 100%;
        padding: 14px;
        margin-bottom: 16px;
        border-radius: 12px;
        background: rgba(0, 0, 0, 0.5);
        border: 1px solid rgba(255, 255, 255, 0.08);
        color: #fff;
        font-size: 1em;
        transition: all 0.3s ease;
        box-sizing: border-box;
    }

    .cyber-input::placeholder {
        color: rgba(255, 255, 255, 0.3);
    }

    .cyber-input:focus, .cyber-select:focus {
        outline: none;
        border-color: transparent;
        background: rgba(0, 0, 0, 0.7);
        box-shadow: 0 0 0 1px rgba(0, 255, 255, 0.5), 0 0 15px rgba(0, 255, 255, 0.2);
    }

    .cyber-select option {
        background: #0a0a0f;
        color: #fff;
    }

    .cyber-btn {
        background: transparent;
        color: #00ffff;
        border: 1px solid #00ffff;
        font-weight: 600;
        font-size: 1.1em;
        padding: 12px 25px;
        border-radius: 50px;
        cursor: pointer;
        transition: all 0.4s ease;
        text-transform: uppercase;
        letter-spacing: 1.5px;
        width: 100%;
        animation: neonPulse 2.5s infinite;
    }

    .cyber-btn:hover:not(:disabled) {
        background: #00ffff;
        color: #000;
        box-shadow: 0 0 20px rgba(0, 255, 255, 0.6);
        transform: translateY(-2px);
    }

    .cyber-btn:disabled {
        opacity: 0.4;
        cursor: not-allowed;
        animation: none;
        border-color: #555;
        color: #555;
    }

    .cyber-btn-add {
        border-color: #bc13fe;
        color: #bc13fe;
        animation: none;
    }

    .cyber-btn-add:hover {
        background: #bc13fe;
        color: #fff;
        box-shadow: 0 0 20px rgba(188, 19, 254, 0.6);
    }

    .code-display {
        font-size: 3em;
        font-family: 'Courier New', Courier, monospace;
        color: #00ffff;
        text-shadow: 0 0 15px rgba(0, 255, 255, 0.6);
        letter-spacing: 6px;
        margin: 15px 0;
    }

    .neon-divider {
        height: 1px;
        background: linear-gradient(90deg, transparent, rgba(0, 255, 255, 0.3), transparent);
        margin: 30px 0;
        border: none;
    }
  </style>
</head>
<body class="py-10">

  <div class="w-full px-4 flex justify-center">
    <div class="glass-card">
      
      <div id="section-creation" class="text-center">
        <h1 class="cyber-title">GÉNÉRATEUR D'EXAMEN</h1>
        <input type="text" id="titre-examen" placeholder="Titre de l'examen (ex: Programmation S5)" class="cyber-input text-center text-lg">
        <button onclick="creerExamen()" class="cyber-btn mt-2">
          Générer le Code Sécurisé
        </button>

        <div id="resultat" class="mt-8 hidden">
          <p class="text-gray-400 uppercase tracking-widest text-sm">Clé d'accès générée :</p>
          <h2 id="code-affiche" class="code-display font-bold font-mono uppercase"></h2>
          <p class="text-sm text-purple-400 mb-2 tracking-wide">Transmettez cette clé aux étudiants pour l'accès.</p>
        </div>
      </div>

      <hr class="neon-divider">

      <div id="section-questions" class="hidden">
        <h2 class="cyber-title" style="font-size: 1.5em; background-image: linear-gradient(90deg, #bc13fe, #00ffff);">Base de Données des Questions</h2>
        
        <input type="text" id="texte-question" placeholder="Saisir la question ici..." class="cyber-input font-semibold">
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-2">
          <input type="text" id="choix1" placeholder="Option A" class="cyber-input mb-0">
          <input type="text" id="choix2" placeholder="Option B" class="cyber-input mb-0">
          <input type="text" id="choix3" placeholder="Option C" class="cyber-input mb-0">
          <input type="text" id="choix4" placeholder="Option D" class="cyber-input mb-0">
        </div>

        <div class="flex flex-col md:flex-row items-center justify-between gap-4 mt-6 mb-6 p-4 rounded-xl" style="background: rgba(0,0,0,0.3); border: 1px solid rgba(188,19,254,0.2);">
          <label class="font-semibold text-gray-300 tracking-wide">Définir la réponse correcte :</label>
          <select id="reponse-correcte" class="cyber-select w-full md:w-1/2 mb-0">
            <option value="1">Option A</option>
            <option value="2">Option B</option>
            <option value="3">Option C</option>
            <option value="4">Option D</option>
          </select>
        </div>

        <button onclick="ajouterQuestion()" class="cyber-btn cyber-btn-add">
          Insérer la question au système
        </button>

        <p id="msg-succes" class="text-green-400 font-bold mt-6 text-center tracking-wider hidden drop-shadow-[0_0_8px_rgba(74,222,128,0.6)]">Données enregistrées avec succès !</p>
      </div>

    </div>
  </div>

  <script>
    let currentExamId = null;

    function creerExamen() {
      const titre = document.getElementById("titre-examen").value;
      const profId = 1; 

      if (!titre) {
        alert("Veuillez entrer un titre.");
        return;
      }

      fetch('http://localhost:8000/api/exams', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
        body: JSON.stringify({ titre: titre, professeur_id: profId })
      })
      .then(res => res.json())
      .then(data => {
        if(data.exam) {
          document.getElementById("resultat").classList.remove("hidden");
          document.getElementById("code-affiche").innerText = data.exam.code_examen;
          document.getElementById("section-questions").classList.remove("hidden");
          
          currentExamId = data.exam.id;
          
          const btnGen = document.querySelector("button[onclick='creerExamen()']");
          btnGen.disabled = true;
          btnGen.classList.add("opacity-50");
        } else {
          alert("Erreur: " + data.message);
        }
      })
      .catch(err => console.error(err));
    }

    function ajouterQuestion() {
      if (!currentExamId) return;

      const questionData = {
        exam_id: currentExamId,
        texte_question: document.getElementById("texte-question").value,
        choix1: document.getElementById("choix1").value,
        choix2: document.getElementById("choix2").value,
        choix3: document.getElementById("choix3").value,
        choix4: document.getElementById("choix4").value,
        reponse_correcte: document.getElementById("reponse-correcte").value
      };

      if(!questionData.texte_question || !questionData.choix1 || !questionData.choix4) {
          alert("Veuillez remplir la question et tous les choix.");
          return;
      }

      fetch('http://localhost:8000/api/questions', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
        body: JSON.stringify(questionData)
      })
      .then(res => res.json())
      .then(data => {
        if(data.question) {
          const msg = document.getElementById("msg-succes");
          msg.classList.remove("hidden");
          
          document.getElementById("texte-question").value = "";
          document.getElementById("choix1").value = "";
          document.getElementById("choix2").value = "";
          document.getElementById("choix3").value = "";
          document.getElementById("choix4").value = "";
          document.getElementById("reponse-correcte").value = "1";

          setTimeout(() => { msg.classList.add("hidden"); }, 3000);
        } else {
          alert("Erreur lors de l'ajout de la question.");
        }
      })
      .catch(err => console.error(err));
    }
  </script>
</body>
</html>
